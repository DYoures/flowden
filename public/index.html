<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowden: Modern Spatial Productivity Workspace</title>
  <meta name="description" content="Your Ideas, in Motion. Turn scattered information into connected knowledge, and connected knowledge into meaningful action.">
  
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-6) 0;
      background-color: var(--bg-primary);
      position: relative;
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      padding: var(--space-4);
      z-index: 10;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: var(--space-6);
    }

    .auth-brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      overflow: hidden;
      margin-bottom: var(--space-3);
      border-radius: var(--radius-md);
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-primary);
    }

    .auth-mark {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .auth-wordmark-row {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 28px;
      width: 140px;
      margin: 0 auto 6px;
      overflow: hidden;
      background-color: transparent;
    }

    .auth-wordmark {
      width: 120px;
      height: 24px;
      object-fit: contain;
    }

    /* Theme-switched brand assets */
    [data-theme="light"] .auth-mark--dark,
    [data-theme="light"] .auth-wordmark--dark {
      display: none !important;
    }
    [data-theme="dark"] .auth-mark--light,
    [data-theme="dark"] .auth-wordmark--light {
      display: none !important;
    }

    .auth-brand .brand-wordmark {
      font-size: 24px;
      letter-spacing: 0.16em;
      margin-bottom: 6px;
      justify-content: center;
    }

    .auth-brand p {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }

    .auth-card {
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      box-shadow: var(--shadow-md);
    }

    .auth-tabs {
      display: flex;
      gap: 2px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-sm);
      padding: 2px;
      margin-bottom: var(--space-5);
    }

    .auth-tab-btn {
      flex: 1;
      height: 30px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color var(--transition-fast), color var(--transition-fast);
    }

    .auth-tab-btn.tab--active {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-primary);
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-brand">
      <div class="auth-brand-logo">
        <img src="/assets/branding/flowden-mark-light.svg" alt="Flowden Mark" class="auth-mark auth-mark--light">
        <img src="/assets/branding/flowden-mark-dark.svg" alt="Flowden Mark" class="auth-mark auth-mark--dark">
      </div>
      <div class="auth-wordmark-row">
        <img src="/assets/branding/flowden-wordmark-light.svg" alt="Flowden" class="auth-wordmark auth-wordmark--light">
        <img src="/assets/branding/flowden-wordmark-dark.svg" alt="Flowden" class="auth-wordmark auth-wordmark--dark">
      </div>
      <p>Modern Spatial Productivity Workspace</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab-btn tab--active" id="tab-login-btn">Sign In</button>
        <button class="auth-tab-btn" id="tab-register-btn">Create Account</button>
      </div>

      <!-- Login Form -->
      <form id="form-login">
        <div id="login-success" class="form-success" style="display: none; margin-bottom: var(--space-4); padding: 10px 14px; border-radius: var(--radius-sm); background: rgba(20, 184, 166, 0.12); border: 1px solid rgba(20, 184, 166, 0.35); color: #14b8a6; font-size: var(--text-xs); line-height: 1.45;"></div>

        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="input" placeholder="name@domain.com" required autocomplete="email" autofocus />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="input" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <div id="login-error" class="form-error" style="display: none; margin-bottom: var(--space-4);"></div>

        <button type="submit" class="btn btn--primary btn--md" style="width: 100%;" id="btn-login-submit">
          Sign In
        </button>
      </form>

      <!-- Register Form -->
      <form id="form-register" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name / Display Name</label>
          <input type="text" id="reg-name" class="input" placeholder="Alex Thorne" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="input" placeholder="name@domain.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password (at least 8 characters)</label>
          <input type="password" id="reg-password" class="input" placeholder="••••••••" minlength="8" required autocomplete="new-password" />
        </div>

        <div id="register-error" class="form-error" style="display: none; margin-bottom: var(--space-4);"></div>

        <button type="submit" class="btn btn--primary btn--md" style="width: 100%;" id="btn-reg-submit">
          Create Account
        </button>
      </form>
    </div>

    <div style="display: flex; justify-content: center; align-items: center; gap: var(--space-3); margin-top: var(--space-4); font-size: var(--text-xs);">
      <a href="/privacy.html" style="color: var(--text-secondary); text-decoration: none;">Privacy Policy</a>
      <span style="color: var(--border-secondary);">·</span>
      <a href="/terms.html" style="color: var(--text-secondary); text-decoration: none;">Terms and Conditions</a>
    </div>

    <div style="text-align: center; margin-top: var(--space-4); font-size: var(--text-xs); color: var(--text-tertiary);">
      Research → Knowledge → Connection → Planning → Execution
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="/js/utils/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components/toast.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Check if already authenticated
      const user = await window.Auth.checkAuth();
      if (user) {
        window.location.href = '/app.html#/overview';
        return;
      }

      const loginTab = document.getElementById('tab-login-btn');
      const regTab = document.getElementById('tab-register-btn');
      const formLogin = document.getElementById('form-login');
      const formReg = document.getElementById('form-register');
      const loginSuccessEl = document.getElementById('login-success');

      loginTab.addEventListener('click', () => {
        loginTab.classList.add('tab--active');
        regTab.classList.remove('tab--active');
        formLogin.style.display = 'block';
        formReg.style.display = 'none';
      });

      regTab.addEventListener('click', () => {
        regTab.classList.add('tab--active');
        loginTab.classList.remove('tab--active');
        formReg.style.display = 'block';
        formLogin.style.display = 'none';
        if (loginSuccessEl) loginSuccessEl.style.display = 'none';
      });

      // Login handler
      formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const errEl = document.getElementById('login-error');
        const submitBtn = document.getElementById('btn-login-submit');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';
        errEl.style.display = 'none';
        if (loginSuccessEl) loginSuccessEl.style.display = 'none';

        try {
          await window.Auth.login(email, password);
          window.location.href = '/app.html#/overview';
        } catch (err) {
          errEl.textContent = err.message || 'Login failed.';
          errEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });

      // Register handler
      formReg.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const errEl = document.getElementById('register-error');
        const submitBtn = document.getElementById('btn-reg-submit');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';
        errEl.style.display = 'none';

        try {
          const res = await window.Auth.register(email, password, name);

          // Reset registration form and buttons
          formReg.reset();
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';

          // Switch to Login tab
          loginTab.classList.add('tab--active');
          regTab.classList.remove('tab--active');
          formLogin.style.display = 'block';
          formReg.style.display = 'none';

          // Pre-fill email and focus password
          const loginEmailInput = document.getElementById('login-email');
          const loginPassInput = document.getElementById('login-password');
          loginEmailInput.value = email;
          loginPassInput.value = '';
          loginPassInput.focus();

          // Display success notification
          const successMsg = (res && res.message) ? res.message : 'Your account has been created successfully. Please log in to access your Flowden workspace.';
          if (loginSuccessEl) {
            loginSuccessEl.textContent = successMsg;
            loginSuccessEl.style.display = 'block';
          }
          if (window.showToast) {
            window.showToast(successMsg, 'success', 5000);
          }
        } catch (err) {
          errEl.textContent = err.message || 'Registration failed.';
          errEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      });
    });
  </script>
</body>
</html>
